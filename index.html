  if(e.target.id==='fimp'&&e.target.files[0]){const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.gastos)throw 0;DB=d;migrar();save();render();toast('Copia importada')}
      catch(err){toast('Archivo no válido')}};r.readAsText(e.target.files[0])}
});

document.addEventListener('click',e=>{
  const id=e.target.id||(e.target.closest('button')||{}).id;
  /* --- guardar un gasto --- */
  if(id==='f-go'){
    const a=impNum();
    if(!a||a<=0){toast('Pon un importe');return}
    const d=ADD.fecha||hoy();
    let c,sb;
    if(ADD.modo==='manual'){
      c=(document.getElementById('f-c').value||'').trim()||'Extra';
      const k=Object.keys(DB.cats).find(x=>norm(x)===norm(c));if(k)c=k;
      sb=(document.getElementById('f-s').value||'').trim()||c;
      const ks=subList(c).find(x=>norm(x)===norm(sb));if(ks)sb=ks;
      ensureCat(c,sb);ADD.c=c;ADD.s=sb;
    }else{c=ADD.c;sb=ADD.s||ADD.c}
    const ng={id:uid(),d:d,m:mkey(d),c:c,s:sb,t:(ADD.t||'').trim(),a:+a.toFixed(2),u:Date.now()};
    if(NOGASTO.includes(c)&&ADD.meta&&DB.metas[ADD.meta])ng.meta=ADD.meta;
    DB.gastos.push(ng);
    if(DB.ingresos[mkey(d)]===undefined)DB.ingresos[mkey(d)]=0;
    save();if(navigator.vibrate)navigator.vibrate([10,40,14]);
    const av=avisoLim(c,mkey(d));
    toast('✓ '+eur(a)+' guardado'+(av?' · '+av.t:''),null,av&&av.tipo);
    ADD.fecha=null;ADD.meta='';ADD.imp='';ADD.t='';SELMES=mkey(d);nav('meses');return}
  /* --- crear un gasto fijo mensual --- */
  if(id==='f-fgo'){
    const a=parseFloat((document.getElementById('f-a').value||'').replace(',','.'));
    if(!a||a<=0){toast('Pon un importe');return}
    const dia=Math.min(31,Math.max(1,parseInt(document.getElementById('f-fdia').value,10)||1));
    const desde=document.getElementById('f-fdesde').value||mesHoy();
    const c=ADD.c, sb=ADD.s||ADD.c;
    ensureCat(c,sb);
    DB.fijosN=DB.fijosN||[];
    DB.fijosN.push({id:'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
      c:c,s:sb,t:(document.getElementById('f-ft').value||'').trim(),
      a:+a.toFixed(2),dia:dia,desde:desde,hasta:null,u:Date.now()});
    save();
    const n=generarFijos();
    if(navigator.vibrate)navigator.vibrate([10,40,14]);
    toast(n?'🔁 Creado · '+n+(n===1?' mes registrado':' meses registrados'):'Gasto fijo creado');
    closeSheet();render('add');return}
  /* --- lote --- */
  if(id==='f-prev'){lotePrev();return}
  if(id==='f-lgo'){
    const ok=(LOTE||[]).filter(x=>!x.err);if(!ok.length)return;
    ok.forEach(x=>{ensureCat(x.c,x.s);
      DB.gastos.push({id:uid(),d:x.d,m:mkey(x.d),c:x.c,s:x.s,t:x.t,a:x.a,u:Date.now()});
      if(DB.ingresos[mkey(x.d)]===undefined)DB.ingresos[mkey(x.d)]=0});
    save();if(navigator.vibrate)navigator.vibrate([10,40,14]);
    /* el aviso de limite mas grave de las categorias tocadas */
    const avs=[...new Set(ok.map(x=>x.c+'|'+mkey(x.d)))].map(s=>{const[c,k]=s.split('|');return avisoLim(c,k)}).filter(Boolean).sort((a,b)=>b.p-a.p);
    toast('✓ '+ok.length+' gastos guardados'+(avs[0]?' · '+avs[0].t:''),null,avs[0]&&avs[0].tipo);
    ADD.fecha=null;ADD.lote='';SELMES=mkey(ok[0].d);LOTE=null;nav('meses');return}
  /* --- editar --- */
  if(id==='eg-go'&&EDG){
    const g=DB.gastos.find(x=>x.id===EDG.id);if(!g){closeSheet();return}
    const a=parseFloat((document.getElementById('eg-a').value||'').replace(',','.'));
    if(!a||a<=0){toast('Pon un importe');return}
    const d=document.getElementById('eg-d').value||g.d;
    g.a=+a.toFixed(2);g.d=d;g.m=mkey(d);g.c=EDG.c;g.s=EDG.s||EDG.c;
    g.t=document.getElementById('eg-t').value.trim();
    if(NOGASTO.includes(g.c)&&EDG.meta)g.meta=EDG.meta;else delete g.meta;
    g.u=Date.now();ensureCat(g.c,g.s);
    if(DB.ingresos[g.m]===undefined)DB.ingresos[g.m]=0;
    EDG=null;save();closeSheet();render(null,true);
    const av=avisoLim(g.c,g.m);
    toast('✓ Cambios guardados'+(av?' · '+av.t:''),null,av&&av.tipo);return}
  if(id==='eg-del'&&EDG){const gid=EDG.id;EDG=null;closeSheet();borrarGasto(gid);return}
  /* --- metas --- */
  if(id==='mt-go'&&EDM){
    const n=(document.getElementById('mt-n').value||'').trim();
    const obj=Math.max(0,+document.getElementById('mt-o').value||0);
    if(!n){toast('Ponle un nombre');return}
    if(!obj){toast('Pon cuánto quieres ahorrar');return}
    const mid=EDM.id||('m'+Date.now().toString(36));
    DB.metas[mid]={n,i:(document.getElementById('mt-i').value||'').trim()||'🎯',obj,
      f:document.getElementById('mt-f').value||'',ini:Math.max(0,+document.getElementById('mt-ini').value||0),u:Date.now()};
    ensureCat(NOGASTO[0]);
    const nueva=!EDM.id;EDM=null;save();closeSheet();
    /* si se creo desde el formulario de apuntar, queda elegida */
    if(nueva&&CUR==='add'){ADD.meta=mid;const pmk=document.getElementById('pk-m');if(pmk)pmk.innerHTML=metaPicker()}
    else render(null,true);
    toast(nueva?'Meta creada':'Meta guardada');return}
  if(id==='mt-del'&&EDM){const mid=EDM.id;
    ask('¿Eliminar la meta «'+DB.metas[mid].n+'»? Lo que apartaste sigue contando como ahorro.',()=>{
      DB.metas[mid].del=true;DB.metas[mid].u=Date.now();EDM=null;save();render(null,true);toast('Meta eliminada')},'Sí, eliminar');return}
  /* --- toast, cabecera y buscador --- */
  if(id==='toast-acc'){const fn=TOASTFN;toastOff();if(fn)fn();return}
  if(id==='busb'){nav('buscar');return}
  if(id==='b-clr'){BUS={q:'',c:[],s:[],desde:'',hasta:'',min:'',max:'',ord:'fecha'};render('buscar',true);return}
  /* --- confirmaciones --- */
  if(id==='ask-y'){const cb=ASKCB;ASKCB=null;closeSheet();if(cb)cb();return}
  if(id==='ask-n'){ASKCB=null;closeSheet();return}
  /* --- categorías --- */
  if(id==='nc-go'){
    const n=(document.getElementById('nc-n').value||'').trim();
    if(!n){toast('Ponle un nombre');return}
    if(DB.cats[n]){toast('Ya existe');return}
    const ic=(document.getElementById('nc-i').value||'').trim();
    const sb=(document.getElementById('nc-s').value||'').split(',').map(x=>x.trim()).filter(Boolean);
    DB.cats[n]=sb;if(ic)DB.icons[n]=ic;asignaColor(n);
    ADD.c=n;ADD.s=subList(n)[0];save();closeSheet();render();toast('Categoría creada');return}
  if(id==='ns-go'){
    const c=(e.target.closest('[data-forcat]')||{dataset:{}}).dataset.forcat;
    const n=(document.getElementById('ns-n').value||'').trim();
    if(!c||!n){toast('Escribe un nombre');return}
    ensureCat(c,n);ADD.c=c;ADD.s=n;save();closeSheet();render();toast('Subcategoría añadida');return}
  if(id==='ec-add'&&EDITC){syncEdit();
    const v=(document.getElementById('ec-new').value||'').trim();
    if(!v){toast('Escribe un nombre');return}
    if(!EDITC.subs.includes(v))EDITC.subs.push(v);
    document.getElementById('sc').innerHTML='<button type="button" class="shbk" id="shbk">← Volver</button>'+catSheet();return}
  if(id==='ec-save'&&EDITC){syncEdit();
    const o=EDITC.o,n=EDITC.n;
    if(n!==o&&DB.cats[n]){toast('Ya existe «'+n+'»');return}
    const out={};Object.keys(DB.cats).forEach(k=>{if(k===o)out[n]=EDITC.subs.slice();else out[k]=DB.cats[k]});
    DB.cats=out;
    if(n!==o){DB.gastos.forEach(g=>{if(g.c===o)g.c=n});delete DB.icons[o]}
    DB.icons[n]=EDITC.i;
    if(n!==o)delete DB.colores[o];
    DB.colores[n]=EDITC.col||ccolor(o);
    delete DB.limites[o];
    if(EDITC.lim>0)DB.limites[n]=EDITC.lim;
    if(ADD.c===o)ADD.c=n;
    EDITC=null;save();closeSheet();render();toast('Categoría guardada');return}
  if(id==='ec-del'&&EDITC){const c=EDITC.o;
    ask('¿Eliminar la categoría «'+c+'»? Los gastos ya apuntados se conservan.',()=>{
      delete DB.cats[c];delete DB.icons[c];delete DB.limites[c];EDITC=null;save();render();toast('Categoría eliminada')},'Sí, eliminar');return}
  /* --- meses e ingresos --- */
  if(id==='add-mes'){openSheet(`<div class="sht">Añadir un mes</div>
    <div class="fg"><label>Mes</label><input id="am-k" type="month" value="${hoy().slice(0,7)}"></div>
    <div class="fg"><label>Ingresos del mes (€)</label><input id="am-i" type="number" step="1" value="0" inputmode="decimal"></div>
    <button class="btn" id="am-go">Añadir mes</button>`);return}
  if(id==='am-go'){const k=document.getElementById('am-k').value;
    if(!/^\d{4}-\d{2}$/.test(k||'')){toast('Elige un mes');return}
    DB.ingresos[k]=+document.getElementById('am-i').value||0;
    save();closeSheet();render();toast('Mes añadido');return}
  if(id==='add-cat'){nuevaCat();return}
  /* --- datos --- */
  if(id==='exp'){dl('mis-gastos-'+hoy()+'.json',JSON.stringify(DB,null,1),'application/json');return}
  if(id==='expc'){
    const rows=[['Fecha','Categoria','Subcategoria','Descripcion','Importe']].concat(
      [...DB.gastos].sort((a,b)=>a.d.localeCompare(b.d)).map(g=>[g.d,g.c,g.s,g.t,String(g.a).replace('.',',')]));
    dl('mis-gastos.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv');return}
  if(id==='imp'){document.getElementById('fimp').click();return}
  /* --- sincronizacion --- */
  if(id==='sy-go'){
    const o=(document.getElementById('sy-o').value||'').trim();
    const rp=(document.getElementById('sy-r').value||'').trim();
    const tk=(document.getElementById('sy-t').value||'').trim();
    if(!o||!rp||!tk){toast('Faltan datos');return}
    syncPon({owner:o,repo:rp,path:'datos.json',branch:'main',token:tk,last:0});
    toast('Conectando…');sincronizar(true).then(()=>render());return}
  if(id==='sy-now'){sincronizar(true);return}
  if(id==='sy-off'){ask('Se borrará la llave de este dispositivo. Tus gastos se quedan aquí y en el repositorio.',()=>{
    syncQuita();SYNCST='off';pintaSync();render();toast('Desconectado')},'Sí, desconectar');return}
  if(id==='syncb'){sincronizar(true);return}
  if(id==='rst'){
    if(!syncCfg()){toast('Solo con la sincronización conectada');return}
    ask('Se borrarán los gastos guardados en este dispositivo y se volverán a traer del repositorio. Úsalo solo si algo se ha descuadrado aquí.',()=>{
      localStorage.removeItem(KEY);DB=null;load();sincronizar(true).then(()=>render());
      toast('Trayendo del repositorio…')},'Sí, traer de nuevo');return}
});

function dl(name,txt,mime){const b=new Blob([txt],{type:mime}),u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('Descargando…')}

/* ============ sincronizacion con un repositorio privado de GitHub ============ */
const SKEY='misgastos_sync';
let SYNCST='off', SYNCMSG='', SYNCTM=null;

function syncCfg(){try{const c=JSON.parse(localStorage.getItem(SKEY));return c&&c.token?c:null}catch(e){return null}}
function syncPon(c){try{localStorage.setItem(SKEY,JSON.stringify(c))}catch(e){}}
function syncQuita(){try{localStorage.removeItem(SKEY)}catch(e){}}

function b64enc(s){const b=new TextEncoder().encode(s);let o='';
  for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
  return btoa(o)}
function b64dec(x){const bin=atob(String(x).replace(/\s/g,''));const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(a)}

function ghUrl(c){return 'https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+'/contents/'+(c.path||'datos.json')}
function ghCab(c){return{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}
async function ghLeer(c){
  const r=await fetch(ghUrl(c)+'?ref='+(c.branch||'main')+'&t='+Date.now(),{headers:ghCab(c),cache:'no-store'});
  if(r.status===404)return{datos:null,sha:null};
  if(r.status===401||r.status===403)throw new Error('la llave no vale o no tiene permiso');
  if(!r.ok)throw new Error('GitHub respondió '+r.status);
  const j=await r.json();
  let d=null; try{d=JSON.parse(b64dec(j.content))}catch(e){throw new Error('el archivo del repositorio no se entiende')}
  return{datos:d,sha:j.sha};
}
async function ghEscribir(c,datos,sha){
  const cuerpo={message:'gastos '+new Date().toISOString().slice(0,16).replace('T',' '),
    content:b64enc(JSON.stringify(datos)),branch:c.branch||'main'};
  if(sha)cuerpo.sha=sha;
  const r=await fetch(ghUrl(c),{method:'PUT',headers:Object.assign(ghCab(c),{'Content-Type':'application/json'}),body:JSON.stringify(cuerpo)});
  if(r.status===409||r.status===422)throw new Error('conflicto, se reintenta solo');
  if(!r.ok)throw new Error('GitHub respondió '+r.status);
  const j=await r.json();
  return j.content&&j.content.sha;
}

function paquete(){return{v:1,gastos:DB.gastos||[],ingresos:DB.ingresos||{},cats:DB.cats||{},
  icons:DB.icons||{},limites:DB.limites||{},borrados:DB.borrados||{},mig:+DB.mig||0,cfgU:+DB.cfgU||0,
  colores:DB.colores||{},metas:DB.metas||{},fijosN:DB.fijosN||[]}}

/* fusion: los movimientos se unen por id (gana el editado mas tarde);
   la configuracion la aporta el dispositivo que guardo mas recientemente */
function fundir(rem,loc){
  if(!rem||!Array.isArray(rem.gastos))return loc;
  const bor={};
  [rem.borrados||{},loc.borrados||{}].forEach(o=>Object.keys(o).forEach(k=>{bor[k]=Math.max(+bor[k]||0,+o[k]||0)}));
  const map=new Map();
  (rem.gastos||[]).forEach(g=>{if(g&&g.id)map.set(g.id,g)});
  (loc.gastos||[]).forEach(g=>{if(!g||!g.id)return;const o=map.get(g.id);
    if(!o||(+g.u||0)>=(+o.u||0))map.set(g.id,g)});
  const gastos=[...map.values()].filter(g=>!(bor[g.id]&&bor[g.id]>=(+g.u||0)));
  const locGana=(+loc.cfgU||0)>=(+rem.cfgU||0);
  const viejo=locGana?rem:loc, nuevo=locGana?loc:rem;
  const une=k=>Object.assign({},viejo[k]||{},nuevo[k]||{});
  /* metas: una a una, gana la editada mas tarde (las borradas llevan del:true) */
  const metas={};
  [rem.metas||{},loc.metas||{}].forEach(o=>Object.entries(o).forEach(([k,m])=>{
    if(m&&(!metas[k]||(+m.u||0)>=(+metas[k].u||0)))metas[k]=m}));
  /* fijos: uno a uno por id, gana el tocado mas tarde */
  const fmap=new Map();
  (rem.fijosN||[]).forEach(f=>{if(f&&f.id)fmap.set(f.id,f)});
  (loc.fijosN||[]).forEach(f=>{if(!f||!f.id)return;const o=fmap.get(f.id);
    if(!o||(+f.u||0)>=(+o.u||0))fmap.set(f.id,f)});
  return{v:1,gastos:gastos,ingresos:une('ingresos'),cats:une('cats'),icons:une('icons'),
    limites:une('limites'),borrados:bor,mig:Math.max(+rem.mig||0,+loc.mig||0),
    cfgU:Math.max(+rem.cfgU||0,+loc.cfgU||0),colores:une('colores'),metas:metas,fijosN:[...fmap.values()]};
}

function pintaSync(){document.querySelectorAll('.syncb').forEach(b=>{b.className='tb syncb '+SYNCST;b.title=syncTit();b.firstElementChild.textContent=syncGlifo()})}

async function sincronizar(manual,intento){
  const c=syncCfg();
  if(!c){SYNCST='off';pintaSync();return}
  if(SYNCST==='sync'&&!manual)return;
  if(!navigator.onLine){SYNCST='err';SYNCMSG='sin conexión';pintaSync();if(manual)toast('Sin conexión');return}
  SYNCST='sync';SYNCMSG='';pintaSync();
  try{
    const {datos,sha}=await ghLeer(c);
    const loc=paquete();
    const fus=fundir(datos,loc);
    const antes=JSON.stringify(loc), despues=JSON.stringify(fus);
    if(antes!==despues){
      DB.gastos=fus.gastos;DB.ingresos=fus.ingresos;DB.cats=fus.cats;DB.icons=fus.icons;
      DB.limites=fus.limites;DB.borrados=fus.borrados;DB.mig=fus.mig;DB.cfgU=fus.cfgU;
      DB.colores=fus.colores;DB.metas=fus.metas;DB.fijosN=fus.fijosN||[];
      Object.keys(DB.cats).forEach(asignaColor);
      try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
    }
    if(!datos||despues!==JSON.stringify(datos)){
      const nuevoSha=await ghEscribir(c,fus,sha);
      c.sha=nuevoSha;
    }else c.sha=sha;
    c.last=Date.now();syncPon(c);
    SYNCST='ok';
    if(antes!==despues&&generarFijos()){/* lo nuevo se sube en la proxima sincronizacion */}
    if(antes!==despues&&!SHEETOPEN)refresca();
    if(manual)toast('Sincronizado · '+fus.gastos.length+' movimientos');
  }catch(e){
    const m=String(e&&e.message||e);
    if(/conflicto/.test(m)&&!intento){setTimeout(()=>sincronizar(manual,1),800);return}
    SYNCST='err';SYNCMSG=m;
    if(manual)toast('No se pudo sincronizar: '+m);
  }
  pintaSync();
}
function syncSoon(){if(!syncCfg())return;clearTimeout(SYNCTM);SYNCTM=setTimeout(()=>sincronizar(false),2500)}
window.addEventListener('online',()=>sincronizar(false));
document.addEventListener('visibilitychange',()=>{if(!document.hidden){
  /* al volver a la app puede haber cambiado de mes: se revisan los fijos */
  if(generarFijos()&&!SHEETOPEN)refresca();
  sincronizar(false)}});


/* ============ init ============ */
let DIAHOY=hoy();
document.addEventListener('visibilitychange',()=>{
  /* si la app se quedo abierta y ha cambiado el dia, se repinta para que «hoy» sea hoy */
  if(!document.hidden&&hoy()!==DIAHOY){DIAHOY=hoy();if(!SHEETOPEN)refresca()}
});
function boot(){
  /* restos de versiones anteriores */
  try{localStorage.removeItem('misgastos_lock')}catch(e){}
  try{sessionStorage.removeItem('restaurar')}catch(e){}
  load();generarFijos();history.replaceState({v:'inicio',mes:null,sheet:0},'');render('inicio');
  /* atajos del icono (manifest): ?nuevo abre el formulario y ?buscar el buscador; atrás vuelve a Inicio */
  const q=new URLSearchParams(location.search);
  const ir=q.has('nuevo')?'add':(q.has('buscar')?'buscar':null);
  if(ir){if(ir==='add')ADD.modo='rapido';history.replaceState({v:'inicio',mes:null,sheet:0},'',location.pathname);nav(ir)}
  if(syncCfg())sincronizar(false);
}
boot();
/* en beta.html no se registra el service worker, para no tocar la cache de la app buena */
if('serviceWorker' in navigator && location.protocol.startsWith('http') && !/beta\.html$/.test(location.pathname))
  navigator.serviceWorker.register('sw.js').catch(()=>{});
